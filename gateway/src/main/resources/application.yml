server:
  port: 8080 # Gateway thường chạy ở port mặc định 80 hoặc 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      # Cấu hình CORS (Cross-Origin Resource Sharing) toàn cục
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000" # URL của Frontend (React/Angular/Vue)
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      # Cấu hình Định tuyến (Routes)
      routes:
        # Route cho Auth
        - id: auth-route
          uri: http://localhost:8081 # Địa chỉ thực của auth-services
          predicates:
            - Path=/api/v1/auth/** # Mọi request bắt đầu bằng /api/v1/auth/ sẽ vào đây
          filters:
            - RewritePath=/api/v1/auth/(?<segment>.*), /api/v1/${segment}

        # Route cho Proposal
        - id: proposal-route
          uri: http://localhost:8081 # Monolith
          predicates:
            - Path=/api/v1/proposals/**

        # Route cho Master Data Services
        - id: data-route
          uri: http://localhost:8081 # Monolith
          predicates:
            - Path=/api/v1/data/**

        # Route cho Finance
        - id: finance-route
          uri: http://localhost:8081 # Monolith
          predicates:
            - Path=/api/v1/finance/**

        # Route cho Document
        - id: document-route
          uri: http://localhost:8081 # Monolith
          predicates:
            - Path=/api/v1/documents/**

        # Route cho Notification
        - id: notification-route
          uri: http://localhost:8081 # Monolith
          predicates:
            - Path=/api/v1/notifications/**

        # Route cho Workflow
        - id: workflow-route
          uri: http://localhost:8081 # Monolith
          predicates:
            - Path=/api/v1/process/**
          filters:
            - RewritePath=/api/v1/process/(?<segment>.*), /api/v1/workflow/${segment}

        # Route dành riêng cho giao diện Camunda Webapp
        - id: camunda-webapp-route
          uri: http://localhost:8081 # Monolith
          predicates:
            - Path=/camunda/**
          filters:
            # Bắt buộc để giải quyết triệt để lỗi 302 Redirect bị mất cổng 8080
            - PreserveHostHeader

        # Route dành cho REST API của Camunda
        - id: camunda-engine-rest-route
          uri: http://localhost:8081 # Monolith
          predicates:
            - Path=/engine-rest/**
          filters:
            - PreserveHostHeader

        # Route cho HR
        - id: hr-route
          uri: http://localhost:8081 # Monolith
          predicates:
            - Path=/api/v1/hr/** # Mọi request bắt đầu bằng /api/v1/hr/ sẽ vào đây
          filters:
            - RewritePath=/api/v1/hr/(?<segment>.*), /api/v1/${segment}

        # Route riêng cho Swagger Docs
        - id: monolith-docs-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/monolith/api-docs
          filters:
            - RewritePath=/api/v1/monolith/api-docs, /api-docs

jwt:
  secret: phongora-vnF3A51D86CB9047E21A6E9CF5D14B7382E8570AD1C63E492FB04A7E9C52D8163F
  expiration: 86400000 # Thời gian sống của Token (1 ngày tính bằng ms)

# (Tùy chọn) Cấu hình log để dễ debug quá trình routing
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: TRACE
    reactor.netty: DEBUG

springdoc:
  swagger-ui:
    # Cấu hình Gateway tổng hợp API docs từ Monolith
    urls:
      - name: Phongora AW Monolith
        url: /api/v1/monolith/api-docs