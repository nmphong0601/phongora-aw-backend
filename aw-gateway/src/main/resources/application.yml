server:
  port: 8080 # Gateway thường chạy ở port mặc định 80 hoặc 8080

spring:
  application:
    name: aw-gateway
  cloud:
    gateway:
      # Cấu hình CORS (Cross-Origin Resource Sharing) toàn cục
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000" # URL của Frontend (React/Angular/Vue)
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      # Cấu hình Định tuyến (Routes)
      routes:
        # Route cho Auth
        - id: auth-route
          uri: http://localhost:8081 # Địa chỉ thực của auth-services
          predicates:
            - Path=/api/v1/auth/** # Mọi request bắt đầu bằng /api/v1/auth/ sẽ vào đây
          filters:
            - RewritePath=/api/v1/auth/(?<segment>.*), /$\{segment}

        # Route cho Proposal
        - id: proposal-route
          uri: http://localhost:8082 # Địa chỉ thực của proposal-services
          predicates:
            - Path=/api/v1/proposals/**

        # Route cho Master Data Services
        - id: data-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/data/**

        # Route cho Finance
        - id: finance-route
          uri: http://localhost:8084 # Địa chỉ thực của finance-services
          predicates:
            - Path=/api/v1/finance/**

        # Route cho Document
        - id: document-route
          uri: http://localhost:8085 # Địa chỉ thực của document-services
          predicates:
            - Path=/api/v1/documents/**

        # Route cho Notification
        - id: notification-route
          uri: http://localhost:8086 # Địa chỉ thực của notification-services
          predicates:
            - Path=/api/v1/notifications/**

        # Route cho Workflow
        - id: workflow-route
          uri: http://localhost:8087 # Địa chỉ thực của workflow-services
          predicates:
            - Path=/api/v1/workflow/**
          filters:
            - RewritePath=/api/v1/workflow/(?<segment>.*), /$\{segment}

        # Route dành riêng cho giao diện Camunda Webapp
        - id: camunda-webapp-route
          uri: http://localhost:8087
          predicates:
            - Path=/camunda/**

        # Route cho HR
        - id: hr-route
          uri: http://localhost:8088 # Địa chỉ thực của hr-services
          predicates:
            - Path=/api/v1/hr/** # Mọi request bắt đầu bằng /api/v1/hr/ sẽ vào đây
          filters:
            - RewritePath=/api/v1/hr/(?<segment>.*), /$\{segment}

jwt:
  secret: phongora-vnF3A51D86CB9047E21A6E9CF5D14B7382E8570AD1C63E492FB04A7E9C52D8163F
  expiration: 86400000 # Thời gian sống của Token (1 ngày tính bằng ms)

# (Tùy chọn) Cấu hình log để dễ debug quá trình routing
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG

springdoc:
  swagger-ui:
    # Cấu hình danh sách các service mà Gateway sẽ tổng hợp API docs
    urls:
      - name: auth
        url: /api/v1/auth/api-docs
      - name: workflow
        url: /api/v1/workflow/api-docs
      - name: hr
        url: /api/v1/hr/api-docs