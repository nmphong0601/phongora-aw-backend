server:
  port: 8081

spring:
  application:
    name: auth

  # Cấu hình PostgreSQL lưu trữ User và Role
  datasource:
    url: jdbc:postgresql://localhost:5432/aw_auth
    username: awuser
    password: phongora1T@Dmin
    driver-class-name: org.postgresql.Driver

  # Cấu hình Redis
  data:
    redis:
      host: localhost
      port: 6379

# Cấu hình JWT (Secret này PHẢI KHỚP với Secret cấu hình bên Gateway)
jwt:
  secret: phongora-vnF3A51D86CB9047E21A6E9CF5D14B7382E8570AD1C63E492FB04A7E9C52D8163F
  expiration: 86400000 # Thời gian sống của Token (1 ngày tính bằng ms)
  refresh-expiration: 604800000  # 7 ngày

# Cấu hình MyBatis
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.aw.common.config.type
  configuration:
    # Tự động chuyển đổi tên cột (ví dụ: is_active -> isActive, full_name -> fullName)
    map-underscore-to-camel-case: true

# Bật log để xem câu lệnh SQL thực thi của MyBatis (thay thế cho jpa.show-sql)
logging:
  level:
    com.aw.auth.mapper: DEBUG

springdoc:
  api-docs:
    path: /api-docs

service:
  hr:
    url: http://localhost:8088